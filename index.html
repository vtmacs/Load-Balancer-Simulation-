<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Balancer Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .server-card {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            width: 30%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: border-color 0.3s;
        }
        .server-card.warning {
            border-color: red;
            background-color: #ffe6e6;
        }
        .progress-bar-container {
            background-color: #e0e0e0;
            border-radius: 4px;
            height: 20px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-bar.warning {
            background-color: red;
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .logs {
            background-color: #222;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            height: 300px;
            overflow-y: scroll;
            font-family: monospace;
        }
        .log-entry.warning {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Load Balancer Simulation (Least Connections)</h1>

    <div class="controls">
        <button id="startBtn">Start Simulation (50 Requests)</button>
    </div>

    <div class="container" id="serverContainer">
        <!-- Server cards will be generated here -->
    </div>

    <h2>Traffic Logs</h2>
    <div class="logs" id="logPanel"></div>

    <script src="app.js"></script>
</body>
</html>
